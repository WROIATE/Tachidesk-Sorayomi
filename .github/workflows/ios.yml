name: Build iOS (unsigned)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ios.yml'
      - 'ios/**'
      - 'lib/**'
      - 'assets/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'build.yaml'
      - 'l10n.yaml'

# Fork builds need no signing secrets or release/deployment permissions.
permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.7'
          channel: stable
          cache: true

      - name: Show toolchain
        run: |
          flutter --version
          xcodebuild -version
          pod --version

      - name: Resolve dependencies and generate sources
        run: |
          flutter pub get --enforce-lockfile
          flutter gen-l10n
          dart run build_runner build --delete-conflicting-outputs

      - name: Build for iPhone and iPad
        run: flutter build ios --release --no-pub --no-codesign --build-number "$GITHUB_RUN_NUMBER"

      - name: Package unsigned IPA
        run: |
          mkdir -p "$RUNNER_TEMP/ios-package/Payload" build/ios-artifacts
          ditto build/ios/iphoneos/Runner.app "$RUNNER_TEMP/ios-package/Payload/Runner.app"
          (cd "$RUNNER_TEMP/ios-package" && zip -r -q "$GITHUB_WORKSPACE/build/ios-artifacts/sorayomi-ios-unsigned.ipa" Payload)
          (cd build/ios-artifacts && shasum -a 256 sorayomi-ios-unsigned.ipa > SHA256SUMS)
          {
            echo '### iPhone / iPad build'
            echo "Commit: $GITHUB_SHA"
            echo "Build number: $GITHUB_RUN_NUMBER"
            echo 'Download the IPA from the workflow artifact below. It is unsigned and must be signed before installation on an iPhone or iPad.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: sorayomi-ios-unsigned-${{ github.run_number }}
          path: build/ios-artifacts/
          if-no-files-found: error
          retention-days: 14
